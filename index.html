<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>💌</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Gate: senza token corretto non si vede nulla -->
    <div id="gate">
        <p>✨</p>
    </div>

    <!-- Contenuto protetto: nascosto di default -->
    <div id="content" style="display: none;">

        <!-- 1. HERO -->
        <section class="hero">
            <div class="hero-names">Valentino & ___</div>
            <div class="hero-date">5 settembre</div>
            <div class="scroll-indicator">
                <span class="chevron">‹</span>
            </div>
        </section>

        <!-- 2. ANIMAZIONE -->
        <section class="animation-scene">
            <canvas id="animation-canvas"></canvas>
            <!-- La letterina easter egg -->
            <div id="letter-easter-egg" class="letter-hidden">
                <div class="letter-content">
                    <!-- Qui va il messaggio esclusivo -->
                    <p>Scrivi qui il tuo messaggio segreto...</p>
                </div>
            </div>
        </section>

        <!-- 3. GALLERIA -->
        <section class="gallery">
            <div class="gallery-grid">
                <!-- Le foto verranno aggiunte qui -->
                <!-- Esempio:
                <div class="photo-card">
                    <img src="img/foto-01.jpg" alt="" loading="lazy">
                    <span class="caption">Un momento</span>
                </div>
                -->
            </div>
        </section>

        <!-- 4. POESIE -->
        <section class="poems">
            <!-- Esempio di poesia:
            <div class="poem">
                <blockquote>
                    <p>Qui il testo della poesia</p>
                </blockquote>
                <cite>— Nome Autore</cite>
            </div>
            <div class="poem-divider"></div>
            -->
        </section>

        <!-- 5. LE MIE PAROLE -->
        <section class="my-words">
            <!-- Esempio di bigliettino:
            <div class="note-card" style="--rotation: 2deg;">
                <p>Qui il tuo testo personale...</p>
            </div>
            -->
        </section>

        <!-- 6. CHIUSURA -->
        <section class="closing">
            <p class="closing-text">La tua frase finale qui...</p>
            <div class="heart-pulse">♥</div>
        </section>

    </div>

    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
